<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>탕탕 수호대</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      background-color: #121214;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overscroll-behavior: none;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>

  <!-- 1. 원스토어 H5 웹게임 SDK (Phaser 및 게임 코드보다 먼저 최상위에서 로드) -->
  <script type="module">
    import { createSDK } from "https://h5sdk.onestore.net/lib/v1.2.0/onestore-h5-sdk.min.js";

    const sdk = createSDK();
    window.oneStoreSDK = sdk;
    window.ONEstoreH5 = sdk;
    window.createSDK = createSDK;

    // 게임 컨트롤러 준비 대기 헬퍼
    function whenGameReady(fn) {
      if (window.TangTangGuard) {
        fn(window.TangTangGuard);
      } else {
        document.addEventListener("gameReady", (e) => fn(e.detail || window.TangTangGuard), { once: true });
      }
    }

    /* ── 라이프사이클: initializeAsync() 이전에 등록 ── */
    sdk.on("pause", () => {
      // 앱 백그라운드 전환 시 게임 및 소리 일시정지
      whenGameReady((game) => game.pause());
    });

    sdk.on("resume", () => {
      // 앱 복귀 시 게임 및 소리 재개
      whenGameReady((game) => game.resume());
    });

    sdk.on("exit", () => {
      // 동기식 0.5초 이내 진행 저장 (필요 시)
    });

    sdk.onBackPressed(() => {
      // 뒤로가기 버튼 처리: 닫을 게임 내 팝업이 없으면 false 반환 (앱 종료 확인창 팝업)
      return false;
    });

    /* ── 부팅 흐름: init → loading progress → start ── */
    sdk.initializeAsync()
      .then((info) => {
        if (info.err) {
          // 일반 브라우저(GitHub Pages, Live Server): SDK 없이 지금처럼 바로 시작
          whenGameReady((game) => game.start());
          return;
        }

        // 원스토어 앱 환경: 로딩 진행률 보고 후 startGameAsync 호출
        let progress = 0;
        const timer = setInterval(() => {
          progress += 25;
          sdk.setLoadingProgress(Math.min(100, progress));
          if (progress >= 100) {
            clearInterval(timer);
            sdk.startGameAsync()
              .then(() => {
                whenGameReady((game) => game.start());
              })
              .catch((e) => {
                console.warn("startGameAsync failed:", e);
              });
          }
        }, 50);
      })
      .catch((e) => {
        console.warn("ONE store SDK initialization failed:", e);
      });
  </script>

  <!-- 2. Phaser 3 라이브러리 (defer 적용하여 SDK 모듈 순서 보장) -->
  <script defer src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <!-- 3. 게임 실행 진입점 (type="module") -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
